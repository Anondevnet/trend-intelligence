# Unit prices used for cost accounting. Prices change -- re-verify before relying on them.
# Each block records where and when the numbers were read.

x:
  source: "https://docs.x.com/x-api/getting-started/pricing"
  retrieved: "2026-11-19"
  model: "pay-per-use; reads per resource, writes per request; same resource re-read within a UTC day is not re-billed"
  unit_usd:
    post_read: 0.005
    user_read: 0.010
    owned_read: 0.001
    post_create: 0.015
    post_create_with_url: 0.200
    post_create_summoned: 0.010
    user_interaction_create: 0.015   # likes/follows -- never automated by this app
    media_metadata: 0.005
    counts_recent: 0.005
    trends: 0.010
  monthly_post_read_cap: 3000000

anthropic:
  # Each model carries its own source URL + retrieval date so it can be re-checked individually.
  # The page lists display names, not API IDs; page_label is the row each figure was read from.
  # Global routing assumed (no inference_geo surcharge).
  usd_per_million_tokens:
    claude-opus-5-5:
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
      retrieved: "2026-11-19"
      page_label: "Claude Opus 5.5"
      input: 4.00
      output: 20.00
      cache_write_5m: 5.00
      cache_write_1h: 8.00
      cache_read: 0.20
    claude-sonnet-5-5:
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
      retrieved: "2026-11-19"
      page_label: "Claude Sonnet 5.5"
      input: 2.00
      output: 10.00
      cache_write_5m: 2.50
      cache_write_1h: 4.00
      cache_read: 0.10
    claude-haiku-5-5:
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
      retrieved: "2026-11-19"
      page_label: "Claude Haiku 5.5, prompts up to 100,000 tokens"
      input: 0.10
      output: 0.50
      cache_write_5m: 0.125
      cache_write_1h: 0.20
      cache_read: 0.01
  # Haiku 5.5 only: a request whose prompt (incl. cache reads/writes) exceeds the threshold
  # pays these prices for the whole request.
  long_prompt:
    claude-haiku-5-5:
      source: "https://platform.claude.com/docs/en/about-claude/pricing"
      retrieved: "2026-11-19"
      page_label: "Claude Haiku 5.5, prompts over 100,000 tokens"
      threshold_tokens: 100000
      input: 0.50
      output: 2.50
      cache_write_5m: 0.625
      cache_write_1h: 1.00
      cache_read: 0.05
  batch_discount: 0.5            # 50% off input and output; stacks with caching multipliers (https://platform.claude.com/docs/en/about-claude/pricing)
  inference_geo_us_multiplier: 1.1   # only if inference_geo="us" is ever set; default global = 1.0

free_sources:
  note: "GitHub, HN Algolia, Hugging Face, arXiv, MCP Registry, DeFiLlama, Polymarket Gamma, Solana public RPC, RSS: no per-call charge; requests are counted for rate-limit health."
